<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebCommander</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@picocss/pico@1.*/css/pico.min.css"
    />
    <style>body{flex-direction:column;height:100vh;margin:0;display:flex}header{align-items:center;gap:1rem;padding:.5rem;display:flex}main{flex:1;display:flex}#localPane,#remotePane{border:1px solid #ccc;flex:1;margin:.5rem;padding:1rem;overflow-y:auto}#statusBar{background:#efefef;border-top:1px solid #ccc;gap:2rem;padding:.5rem;font-size:.9rem;display:flex}.app-version{opacity:.55;margin-left:auto;font-size:.75rem}#debug{background:#f9f9f9;border-top:1px solid #ccc;height:150px;padding:.5rem;font-size:.85rem;overflow-y:auto}</style>
    <script type="module" crossorigin src="/filetrader/assets/index-QsJMotGq.js"></script>
  </head>
  <body>
    <header>
      <span>Room:</span><span id="currentRoom">—</span>
      <input type="text" id="roomInput" placeholder="Enter room ID" />
      <button id="joinBtn">Join</button>
    </header>
    <main>
      <section id="localPane">
        <h2>Local</h2>
        <input type="file" id="fileInput" multiple />
        <div id="localFiles"></div>
      </section>
      <section id="remotePane">
        <h2>Remote</h2>
        <div id="remoteFiles"></div>
      </section>
    </main>
    <div id="statusBar">
      <span id="status-signaling">Signaling: <strong>❌</strong></span>
      <span id="status-peer">Peer: <strong>❌</strong></span>
      <span id="status-data">DataChannel: <strong>❌</strong></span>
      <span id="app-version" class="app-version"></span>
    </div>
    <div id="debug"></div>

  </body>
</html>
